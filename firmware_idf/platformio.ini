; =========================================================================
; PlatformIO Configuration - DESIOT BLE Mesh System (ESP-IDF Murni)
; Mata Kuliah: Desain dan Aplikasi IoT - ITS Surabaya
; =========================================================================

[platformio]
build_dir = C:/Users/kegz/desiot_build
default_envs = node3_relay_friend, node1_pump, node2_sensor_lpn, node4_gateway

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

; -------------------------------------------------------------------------
; NODE 3: Relay + Friend Node
; -------------------------------------------------------------------------
[env:node3_relay_friend]
build_flags = 
    -Iinclude
    -DCONFIG_NODE_3_RELAY_FRIEND

; -------------------------------------------------------------------------
; NODE 1: Pompa DC (Generic OnOff Server)
; -------------------------------------------------------------------------
[env:node1_pump]
build_flags = 
    -Iinclude
    -DCONFIG_NODE_1_PUMP

; -------------------------------------------------------------------------
; NODE 2: Sensor Kelembapan (Low Power Node)
; -------------------------------------------------------------------------
[env:node2_sensor_lpn]
build_flags = 
    -Iinclude
    -DCONFIG_NODE_2_SENSOR_LPN

; -------------------------------------------------------------------------
; NODE 4: Provisioner & Wi-Fi MQTT Gateway
; -------------------------------------------------------------------------
[env:node4_gateway]
build_flags = 
    -Iinclude
    -DCONFIG_NODE_4_GATEWAY
