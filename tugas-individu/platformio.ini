; =========================================================================
; PlatformIO Configuration - Tugas Individu DESIOT
; ESP32-S3 + Modul LDR + Blynk IoT + ThingSpeak
; =========================================================================

[platformio]
default_envs = esp32s3_individu

; -------------------------------------------------------------------------
; Environment untuk Board ESP32-S3 (Chip yang Anda gunakan saat ini)
; -------------------------------------------------------------------------
[env:esp32s3_individu]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0

lib_deps =
    blynkkk/Blynk@^1.4.0
    mathworks/ThingSpeak@^2.1.1
    adafruit/DHT sensor library@^1.4.7
    adafruit/Adafruit Unified Sensor@^1.1.15

; -------------------------------------------------------------------------
; Environment cadangan untuk ESP32 Classic (Non-S3)
; -------------------------------------------------------------------------
[env:esp32_classic]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

lib_deps =
    blynkkk/Blynk@^1.4.0
    mathworks/ThingSpeak@^2.1.1
    adafruit/DHT sensor library@^1.4.7
    adafruit/Adafruit Unified Sensor@^1.1.15
